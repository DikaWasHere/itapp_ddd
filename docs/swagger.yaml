info:
  contact: {}
  title: ITAPP
paths:
  /doc-cr:
    post:
      consumes:
      - application/json
      description: Show all DocumentCr
      parameters:
      - description: Request body containing the filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.docCrGetListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.docCrListResponse'
      summary: Show all DocumentCr
      tags:
      - DocumentCr
  /doc-cr-add:
    post:
      consumes:
      - application/json
      description: Add DocumentCr
      parameters:
      - description: Request body containing the filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.docCrCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Document created successfully
          schema:
            $ref: '#/definitions/handler.docCrCreateResponse'
      summary: ADD DocumentCr
      tags:
      - DocumentCr
  /doc-cr-approve:
    post:
      consumes:
      - application/json
      description: Approve DocumentCr
      parameters:
      - description: Request body containing the filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.docCrSendApproveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Revision submitted
          schema:
            items:
              $ref: '#/definitions/handler.approvalApproveResponse'
            type: array
      summary: Approve DocumentCr
      tags:
      - DocumentCr
  /doc-cr-approve-reject:
    post:
      consumes:
      - application/json
      description: approve Reject DocumentCr
      parameters:
      - description: Request body containing the filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.docCrSendApproveRejectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Approval rejected submitted
          schema:
            $ref: '#/definitions/handler.docCrCreateResponse'
      summary: approve Reject DocumentCr
      tags:
      - DocumentCr
  /doc-cr-delete:
    post:
      consumes:
      - application/json
      description: Delete DocumentCr
      parameters:
      - description: Request body containing the filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/doc_cr.DeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: DocumentCr deleted successfully
          schema:
            $ref: '#/definitions/handler.DeleteResponse'
        "400":
          description: Failed to delete DocumentCr
          schema:
            $ref: '#/definitions/doc_cr.ApiResponse'
      summary: Delete DocumentCr
      tags:
      - DocumentCr
  /doc-cr-detail:
    post:
