name: Upload gosec SARIF

on:
  push:
    branches:
      - workflow2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  upload-sarif:
    name: Upload gosec results
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec with AI recommendations
        id: gosec
        env:
          GOSEC_AI_API_KEY: ${{ secrets.GOSEC_AI_API_KEY }}
          GOSEC_AI_PROVIDER: gemini-3.1-pro-preview
        run: |
          if [ -z "$GOSEC_AI_API_KEY" ]; then
            echo "GOSEC_AI_API_KEY is not configured"
            exit 1
          fi
          set +e
          gosec \
            -ai-api-provider "$GOSEC_AI_PROVIDER" \
            -fmt=sarif \
            -out=results.sarif \
            -verbose=json \
            -stdout \
            -log=gosec.log \
            -severity=low \
            -confidence=medium \
            ./... > gosec-recommendations.json
          echo "gosec_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: gosec

      - name: Gagal jika ada temuan
        if: steps.gosec.outputs.gosec_exit != '0'
        run: |
          echo "gosec menemukan masalah — perbaiki dulu sebelum merge."
          exit 1